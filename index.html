<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F18" />
    <meta name="description" content="PITCH — o teu jogo semanal, organizado. Confirmações, pagamentos, sorteio de equipas e stats." />
    <script>
      // Applied before first paint so a saved "light" preference never
      // flashes dark first — src/lib/themeMode.js re-applies this once
      // React mounts (and keeps the theme-color meta above in sync).
      try {
        if (localStorage.getItem("pitch.themeMode") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PITCH — O teu jogo semanal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
